<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Bella Vista Salon{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="container">
    <nav>
      <ul>
        <li><strong><a href="{{ url_for('index') }}">Bella Vista Salon</a></strong></li>
      </ul>
      <ul>
        <li><a href="{{ url_for('index') }}" {% if request.endpoint == 'index' %}aria-current="page"{% endif %}>Home</a></li>
        <li><a href="{{ url_for('services') }}" {% if request.endpoint in ['services', 'service_detail'] %}aria-current="page"{% endif %}>Services</a></li>
        <li><a href="{{ url_for('book') }}" {% if request.endpoint == 'book' %}aria-current="page"{% endif %}>Book</a></li>
        <li><a href="{{ url_for('calendar') }}" {% if request.endpoint == 'calendar' %}aria-current="page"{% endif %}>Staff Calendar</a></li>
        <li><a href="{{ url_for('appointments') }}" {% if request.endpoint == 'appointments' %}aria-current="page"{% endif %}>My Appointments</a></li>
      </ul>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="container">
    <small>Bella Vista Salon &middot; Calle Ocho &middot; Prototype — data is sample data only.</small>
  </footer>
</body>
</html>
